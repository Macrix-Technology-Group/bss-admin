name: Build image

# Build the app into a container image and push it to GitHub Container Registry.
#
# There is deliberately NO deploy job here: the server runs on a private network (10.x) that
# GitHub's cloud runners cannot reach, so GitHub cannot SSH in to deploy. Instead the server pulls
# the image itself — see DEPLOYMENT.md. This workflow's only job is to produce the image; a run
# going green means "a new image is ready to pull".
on:
    push:
        branches: [main]
    workflow_dispatch: # manual "Run workflow" button, to rebuild on demand

concurrency:
    group: build-main
    cancel-in-progress: true

env:
    IMAGE_BASE: ghcr.io/macrix-technology-group/bss-admin

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write # to push the image to ghcr.io under this repo
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - name: Log in to ghcr.io
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # Two tags: the commit sha (immutable — what the server pulls, and what a rollback points
            # back to) and :latest (a convenience pointer to the newest build).
            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  platforms: linux/amd64
                  tags: |
                      ${{ env.IMAGE_BASE }}:${{ github.sha }}
                      ${{ env.IMAGE_BASE }}:latest
                  # Layer cache in the Actions cache, so unchanged layers (npm ci, the build) are
                  # reused and most builds finish in well under a minute.
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
