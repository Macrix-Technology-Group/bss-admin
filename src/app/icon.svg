  <rect x="11" y="28" width="42" height="24" rx="2" fill="#53befc"/>
  <rect x="21" y="35" width="22" height="17" rx="1.5" fill="#0f2942"/>
  <line x1="21" y1="40" x2="43" y2="40" stroke="#53befc" stroke-width="1.6"/>
  <line x1="21" y1="45" x2="43" y2="45" stroke="#53befc" stroke-width="1.6"/>
</svg>
